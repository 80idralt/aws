AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Novatrix data layer (v45 as code). Needs the network stack. Stack name: novatrix-data.

Parameters:
  Prefix:
    Type: String
    Default: novatrix
    AllowedPattern: "[a-z][a-z0-9-]*"
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small]

  BackupDays:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 35
    Description: Days of automatic backup. Free plan allows at most 1, use 14 on a paid account

Resources:
  # Step 9: subnet group and the generated password are done
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub ${Prefix}-db-subnets
      DBSubnetGroupDescription: Private subnets for the Novatrix database
      SubnetIds:
        - !ImportValue {"Fn::Sub": "${Prefix}-private-a-id"}
        - !ImportValue {"Fn::Sub": "${Prefix}-private-b-id"}

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub Admin password for ${Prefix}-db
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  # Step 9: the database (AWS::RDS::DBInstance). Same settings as in v45.
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub ${Prefix}-db
      Engine: mariadb
      EngineVersion: "11.4"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageEncrypted: true
      MasterUsername: admin
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBName: wordpress
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !ImportValue {"Fn::Sub": "${Prefix}-db-sg-id"}
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: !Ref BackupDays
      DeleteAutomatedBackups: true

  # Step 10: EFS (AWS::EFS::FileSystem) with Encrypted: true and FileSystemTags Name ${Prefix}-efs
  FileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: !Sub ${Prefix}-efs
  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !ImportValue {"Fn::Sub": "${Prefix}-private-a-id"}
      SecurityGroups:
        - !ImportValue {"Fn::Sub": "${Prefix}-efs-sg-id"}
  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !ImportValue {"Fn::Sub": "${Prefix}-private-b-id"}
      SecurityGroups:
        - !ImportValue {"Fn::Sub": "${Prefix}-efs-sg-id"}
        
Outputs:
  DbSecretArn:
    Value: !Ref DbSecret
    Export: {Name: !Sub "${Prefix}-db-secret-arn"}
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export: {Name: !Sub "${Prefix}-db-endpoint"}
  FileSystemId:
    Value: !Ref FileSystem
    Export: {Name: !Sub "${Prefix}-efs-id"}

