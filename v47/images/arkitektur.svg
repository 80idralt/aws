<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1100" height="820" fill="#fff"/>

  <!-- Internet -->
  <rect x="400" y="20" width="160" height="40" fill="#f5f5f5" stroke="#666"/>
  <text x="480" y="45" text-anchor="middle">Internet / besökare</text>
  <line x1="480" y1="60" x2="480" y2="108" stroke="#000" marker-end="url(#p)"/>
  <text x="486" y="88">80</text>

  <!-- VPC -->
  <rect x="20" y="110" width="860" height="690" fill="none" stroke="#000"/>
  <text x="28" y="128">novatrix-vpc 10.0.0.0/16</text>

  <!-- ALB -->
  <rect x="300" y="140" width="360" height="50" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="480" y="160" text-anchor="middle">novatrix-alb (alb-sg)</text>
  <text x="480" y="178" text-anchor="middle">listener 80 till novatrix-web-tg</text>

  <!-- Zon a -->
  <rect x="40" y="220" width="400" height="560" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="48" y="238">eu-north-1a</text>
  <rect x="60" y="250" width="360" height="190" fill="#d5e8d4" stroke="#82b366"/>
  <text x="68" y="268">novatrix-public 10.0.1.0/24</text>
  <rect x="140" y="320" width="200" height="60" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="240" y="345" text-anchor="middle">EC2 novatrix-web</text>
  <text x="240" y="362" text-anchor="middle">t3.micro, web-sg</text>

  <rect x="60" y="480" width="360" height="280" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="68" y="498">novatrix-private-a 10.0.2.0/24</text>
  <rect x="80" y="560" width="140" height="60" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="150" y="585" text-anchor="middle">RDS novatrix-db</text>
  <text x="150" y="602" text-anchor="middle">Single-AZ</text>
  <rect x="260" y="560" width="140" height="60" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="330" y="585" text-anchor="middle">EFS</text>
  <text x="330" y="602" text-anchor="middle">mount target</text>

  <!-- Zon b -->
  <rect x="460" y="220" width="400" height="560" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="468" y="238">eu-north-1b</text>
  <rect x="480" y="250" width="360" height="190" fill="#d5e8d4" stroke="#82b366"/>
  <text x="488" y="268">novatrix-public-b 10.0.3.0/24</text>
  <rect x="560" y="320" width="200" height="60" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="660" y="345" text-anchor="middle">EC2 novatrix-web</text>
  <text x="660" y="362" text-anchor="middle">t3.micro, web-sg</text>

  <rect x="480" y="480" width="360" height="280" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="488" y="498">novatrix-private-b 10.0.4.0/24</text>
  <rect x="680" y="560" width="140" height="60" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="750" y="585" text-anchor="middle">EFS</text>
  <text x="750" y="602" text-anchor="middle">mount target</text>
  <text x="500" y="700" fill="#555">ingen databas här (inte Multi-AZ)</text>

  <!-- ASG -->
  <rect x="120" y="300" width="660" height="100" fill="none" stroke="#d79b00" stroke-dasharray="8 4"/>
  <text x="128" y="315" fill="#b46504">novatrix-web-asg (min 2, max 4, CPU 50 %)</text>

  <!-- Pilar ALB till EC2 -->
  <line x1="400" y1="190" x2="260" y2="318" stroke="#000" marker-end="url(#p)"/>
  <text x="318" y="250">80</text>
  <line x1="560" y1="190" x2="640" y2="318" stroke="#000" marker-end="url(#p)"/>
  <text x="608" y="250">80</text>

  <!-- Pilar till data -->
  <line x1="180" y1="380" x2="150" y2="558" stroke="#000" marker-end="url(#p)"/>
  <text x="140" y="470">3306</text>
  <line x1="300" y1="380" x2="330" y2="558" stroke="#000" marker-end="url(#p)"/>
  <text x="322" y="470">2049</text>
  <line x1="700" y1="380" x2="750" y2="558" stroke="#000" marker-end="url(#p)"/>
  <text x="732" y="470">2049</text>
  <line x1="600" y1="380" x2="222" y2="575" stroke="#000" stroke-dasharray="5 4" marker-end="url(#p)"/>
  <text x="430" y="462">3306</text>

  <!-- EFS samma -->
  <line x1="400" y1="600" x2="678" y2="600" stroke="#9673a6" stroke-dasharray="4 4"/>
  <text x="440" y="640" fill="#9673a6">samma EFS i båda zonerna</text>

  <!-- Utanför -->
  <rect x="910" y="160" width="170" height="44" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="995" y="186" text-anchor="middle">Secrets Manager</text>
  <rect x="910" y="230" width="170" height="44" fill="#f5f5f5" stroke="#666"/>
  <text x="995" y="256" text-anchor="middle">S3 (data, backup)</text>
  <rect x="910" y="300" width="170" height="44" fill="#f5f5f5" stroke="#666"/>
  <text x="995" y="326" text-anchor="middle">CloudWatch (CPU)</text>
  <line x1="780" y1="340" x2="908" y2="322" stroke="#000" marker-start="url(#p)" marker-end="url(#p)"/>
  <line x1="760" y1="330" x2="908" y2="190" stroke="#666" marker-end="url(#p)"/>
  <line x1="760" y1="340" x2="908" y2="258" stroke="#666" marker-end="url(#p)"/>
  <text x="840" y="220" fill="#555">443</text>
</svg>
